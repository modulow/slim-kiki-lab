name: Deploy Slim Kiki Lab

on:
  push:
    branches: [main]
    paths:
      - 'docs/slim-kiki-lab/**'
      - '.github/workflows/deploy-slim-kiki-lab.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slim-kiki-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/slim-kiki-lab
      - id: deployment
        uses: actions/deploy-pages@v4
